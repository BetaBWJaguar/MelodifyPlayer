<div class="favorites-page">
    <div class="favorites-header">
        <div class="favorites-header-content">
            <div class="favorites-icon">
                <svg width="56" height="56" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                </svg>
            </div>
            <div class="favorites-header-info">
                <h1 data-i18n="favorites.title"></h1>
                <p data-i18n="favorites.subtitle"></p>
            </div>
        </div>
    </div>
    <div class="favorites-filters">
        <div class="search-container">
            <svg class="search-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input type="text" id="searchInput" placeholder="Search..." data-i18n-placeholder="favorites.searchPlaceholder">
            <button class="clear-search-btn" id="clearSearchBtn" style="display: none;">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
        </div>
        <div class="filter-controls">
            <button class="filter-btn" id="filterNotesBtn" data-filter="notes" data-i18n-title="favorites.filterNotesTitle">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                </svg>
                <span data-i18n="favorites.filterNotes"></span>
            </button>
            <button class="filter-btn" id="filterAllBtn" data-filter="all" data-i18n-title="favorites.filterAllTitle">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
                </svg>
                <span data-i18n="favorites.filterAll"></span>
            </button>
        </div>
    </div>
    <div class="favorites-content" id="favoritesContent">
        <div class="loading-state">
            <div class="spinner"></div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="notesModal">
    <div class="modal-container">
        <div class="modal-header">
            <h2 data-i18n="favorites.addNote"></h2>
            <button class="modal-close-btn" id="closeNotesModal">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div class="modal-body">
            <div class="track-info-display">
                <div class="track-info-image" id="modalTrackImage">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                    </svg>
                </div>
                <div class="track-info-text">
                    <span class="track-info-name" id="modalTrackName"></span>
                    <span class="track-info-artist" id="modalArtistName"></span>
                </div>
            </div>
            <div class="notes-input-container">
                <label for="notesInput" data-i18n="favorites.notesLabel"></label>
                <textarea 
                    id="notesInput" 
                    rows="6" 
                    placeholder="..."
                    data-i18n-placeholder="favorites.notesPlaceholder"
                ></textarea>
                <div class="notes-char-count">
                    <span id="charCount">0</span> / 500
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelNotesBtn" data-i18n="favorites.cancel"></button>
            <button class="btn btn-primary" id="saveNotesBtn" data-i18n="favorites.save"></button>
        </div>
    </div>
</div>
