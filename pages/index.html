<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelodifyPlayer</title>
    <link rel="stylesheet" href="../styles/index.css">
    <script src="../scripts/index.js"></script>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40">
                    <circle cx="20" cy="20" r="18" fill="#e94560"/>
                    <circle cx="20" cy="20" r="6" fill="#1a1a2e"/>
                </svg>
                <span>MelodifyPlayer</span>
            </div>
            
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-page="main-page">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                    </svg>
                    <span data-i18n="sidebar.home"></span>
                </a>
                <a href="#" class="nav-item" data-page="search">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <span data-i18n="sidebar.search"></span>
                </a>
                <a href="#" class="nav-item" data-page="library">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zm0-5.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/>
                    </svg>
                    <span data-i18n="sidebar.yourLibrary"></span>
                </a>
            </nav>

            <div class="sidebar-section">

                <a href="#" class="nav-item" data-page="create-playlist">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                    </svg>
                    <span data-i18n="sidebar.createPlaylist"></span>
                </a>

                <a href="#" class="nav-item" data-page="liked_songs">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5
            2 5.42 4.42 3 7.5 3c1.74 0 3.41.81
            4.5 2.09C13.09 3.81 14.76 3
            16.5 3 19.58 3 22 5.42
            22 8.5c0 3.78-3.4 6.86-8.55
            11.54L12 21.35z"/>
                    </svg>
                    <span data-i18n="sidebar.likedSongs"></span>
                </a>

                <a href="#" class="nav-item" data-page="favorites">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 17.27L18.18 21 16.54 13.97
            22 9.24l-7.19-.61L12 2
            9.19 8.63 2 9.24l5.46
            4.73L5.82 21z"/>
                    </svg>
                    <span data-i18n="sidebar.favorites"></span>
                </a>

                <a href="#" class="nav-item" data-page="stats">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
                    </svg>
                    <span data-i18n="sidebar.stats"></span>
                </a>

            </div>

            <div class="language-selector">
                <button class="lang-btn active" data-lang="en" id="langEn">EN</button>
                <button class="lang-btn" data-lang="tr" id="langTr">TR</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="window-controls">
                <button class="window-btn minimize-btn" id="minimizeBtn">
                    <svg viewBox="0 0 10 10">
                        <line x1="1" y1="5" x2="9" y2="5" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                </button>
                <button class="window-btn maximize-btn" id="maximizeBtn">
                    <svg viewBox="0 0 10 10">
                        <rect x="1" y="1" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                </button>
                <button class="window-btn close-btn" id="closeBtn">
                    <svg viewBox="0 0 10 10">
                        <line x1="1" y1="1" x2="9" y2="9" stroke="currentColor" stroke-width="1.5"/>
                        <line x1="9" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                </button>
            </div>
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="6" x2="21" y2="6"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
            <div class="sidebar-overlay" id="sidebarOverlay"></div>
            <div id="page-container"></div>
        </main>

        <footer class="player-bar">
            <div class="player-left">
                <div class="now-playing">
                    <div class="album-art gradient-1" id="albumArt"></div>
                    <div class="track-info" id="trackInfo">
                        <span class="track-name" data-i18n="player.selectSong" id="trackName"></span>
                        <span class="artists-name" data-i18n="player.startListening" id="artistName"></span>
                    </div>
                    <button class="like-btn" id="likeBtn">
                        <svg class="like-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5
                                2 5.42 4.42 3 7.5 3c1.74 0 3.41.81
                                4.5 2.09C13.09 3.81 14.76 3
                                16.5 3 19.58 3 22 5.42
                                22 8.5c0 3.78-3.4 6.86-8.55
                                11.54L12 21.35z"/>
                        </svg>
                    </button>
                    <button class="favorite-btn" id="favoriteBtn">
                        <svg class="favorite-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                        </svg>
                    </button>
                    <button class="add-to-playlist-player-btn" id="addToPlaylistPlayerBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor" stroke="none" transform="translate(2,-1) scale(0.6)" opacity="0.6"/>
                        </svg>
                    </button>
                    <div class="player-playlist-dropdown" id="playerPlaylistDropdown">
                        <div class="player-playlist-dropdown-header">
                            <span data-i18n="search.addToPlaylist"></span>
                            <button class="player-playlist-dropdown-close" id="closePlayerPlaylistDropdown">×</button>
                        </div>
                        <div class="player-playlist-dropdown-track" id="playerPlaylistDropdownTrack"></div>
                        <div class="player-playlist-dropdown-list" id="playerPlaylistDropdownList"></div>
                        <div class="player-playlist-dropdown-empty" id="playerPlaylistDropdownEmpty" style="display: none;">
                            <p data-i18n="search.noPlaylists"></p>
                        </div>
                    </div>
                    <div class="playlist-info" id="playlistInfo" style="display: none;">
                        <span class="playlist-name" id="playlistName"></span>
                        <span class="playlist-position" id="playlistPosition"></span>
                    </div>
                </div>
            </div>
            <div class="player-center">
                <div class="player-controls">
                    <button class="control-btn" id="shuffleBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
                        </svg>
                    </button>
                    <button class="control-btn" id="prevBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                        </svg>
                    </button>
                    <button class="control-btn play-btn" id="playBtn">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                    </button>
                    <button class="control-btn" id="nextBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                        </svg>
                    </button>
                    <button class="control-btn repeat-btn" id="repeatBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 1l4 4-4 4"/>
                            <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                            <path d="M7 23l-4-4 4-4"/>
                            <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                        </svg>
                    </button>
                </div>
                <div class="progress-bar">
                    <button class="history-btn" id="historyBtn" title="History">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
                        </svg>
                    </button>
                    <div class="history-dropdown" id="historyDropdown">
                        <div class="history-header">
                            <span data-i18n="history.title">History</span>
                            <button class="history-close" id="historyClose">×</button>
                        </div>
                        <div class="history-list" id="historyList">
                        </div>
                    </div>
                    <span class="time" id="currentTime">0:00</span>
                    <div class="progress" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span class="time" id="totalTime">0:00</span>
                </div>
            </div>
            <div class="player-right">
                <button class="control-btn" id="lyricsBtn" title="Lyrics">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                    </svg>
                </button>
                <button class="control-btn" id="volumeBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                    </svg>
                </button>
                <div class="volume-slider-container">
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100">
                </div>
                <button class="control-btn" id="fullscreenBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                    </svg>
                </button>
            </div>
        </footer>
    </div>
</body>
</html>
