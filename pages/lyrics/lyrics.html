<section class="lyrics-page">
    <div class="lyrics-header">
        <div class="lyrics-track-info">
            <div class="lyrics-album-art-wrapper">
                <div class="lyrics-album-art" id="lyricsAlbumArt"></div>
                <div class="lyrics-album-art-glow" id="lyricsAlbumArtGlow"></div>
            </div>
            <div class="lyrics-track-details">
                <div class="lyrics-now-playing-badge" id="lyricsNowPlayingBadge" style="display: none;">
                    <span class="lyrics-pulse-dot"></span>
                    <span data-i18n="lyrics.nowPlaying"></span>
                </div>
                <h2 class="lyrics-track-name" id="lyricsTrackName"></h2>
                <p class="lyrics-artist-name" id="lyricsArtistName"></p>
            </div>
        </div>
        <div class="lyrics-search-bar">
            <svg class="lyrics-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input type="text" class="lyrics-search-input" id="lyricsSearchInput" data-i18n-placeholder="lyrics.searchPlaceholder">
            <button class="lyrics-search-btn" id="lyricsSearchBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </div>
    </div>

    <div class="lyrics-content" id="lyricsContent">
        <div class="lyrics-fade-top"></div>
        <div class="lyrics-fade-bottom"></div>

        <div class="lyrics-empty-state" id="lyricsEmptyState">
            <div class="lyrics-empty-icon-wrapper">
                <div class="lyrics-empty-ring"></div>
                <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                </svg>
            </div>
            <p data-i18n="lyrics.noTrackPlaying"></p>
            <span data-i18n="lyrics.playToSee"></span>
        </div>

        <div class="lyrics-loading" id="lyricsLoading" style="display: none;">
            <div class="lyrics-loader">
                <div class="lyrics-loader-bar"></div>
                <div class="lyrics-loader-bar"></div>
                <div class="lyrics-loader-bar"></div>
                <div class="lyrics-loader-bar"></div>
            </div>
            <p data-i18n="lyrics.searching"></p>
        </div>

        <div class="lyrics-text" id="lyricsText" style="display: none;"></div>

        <div class="lyrics-not-found" id="lyricsNotFound" style="display: none;">
            <div class="lyrics-not-found-icon">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg>
            </div>
            <p data-i18n="lyrics.notFound"></p>
            <span data-i18n="lyrics.tryManual"></span>
        </div>
    </div>
</section>
