<section class="stats-page">
    <div class="page-header">
        <div class="page-header-row">
            <div>
                <h1 data-i18n="stats.title"></h1>
                <p class="page-subtitle" data-i18n="stats.subtitle"></p>
            </div>
            <button class="export-btn" id="exportBtn" onclick="exportStats()" style="display:none;">
                <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                    <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                </svg>
                <span data-i18n="stats.exportStats"></span>
            </button>
        </div>
    </div>

    <div class="stats-content" id="statsContent">
        <div class="loading-state" id="loadingState">
            <div class="spinner"></div>
            <p data-i18n="stats.loading"></p>
        </div>
    </div>
</section>
